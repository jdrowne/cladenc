---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Restore what npm fetched before
        uses: actions/cache@v6
        with:
          key: >-
            npm-${{ github.job }}-${{
            hashFiles('.github/workflows/markdownlint.yml') }}
          path: ~/.npm
          restore-keys: npm-${{ github.job }}-
      - name: Install dependencies
        run: npm install --global --prefer-offline markdownlint-cli
      - name: markdownlint
        run: markdownlint --dot --disable MD013 -- '**/*.md'
  summarize-commits:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the action
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/summarize-commits
      - name: summarize-commits
        uses: ./.github/actions/summarize-commits
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Restore what pip fetched before
        uses: actions/cache@v6
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/markdownlint.yml') }}
          path: ~/.cache/pip
          restore-keys: pip-${{ github.job }}-
      - name: Install dependencies
        run: pip install yamllint
      - name: yamllint
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING, $TRUTHY"
          yamllint --strict --format github \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/markdownlint.yml
name: markdownlint
on:
  push:
    branches:
      - main
    paths:
      - "**.md"
      - ".github/actions/summarize-commits/**"
      - ".github/workflows/markdownlint.yml"
