---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  assert-coverage:
    needs:
      - e2e-test-coverage
      - integration-test-coverage
      - unit-test-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "assert-coverage placeholder"
  assert-no-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install assert-no-comments
      - name: assert-no-comments
        run: >-
          assert-no-comments
          --annotate
          --verbose
          ${{ github.workspace }}
  assert-no-empty-test-files:
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "assert-no-empty-test-files placeholder"
  assert-no-inline-directives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install assert-no-inline-directives
      - name: assert-no-inline-directives
        run: >-
          assert-no-inline-directives
          --tools markdownlint,yamllint
          --verbose
          ${{ github.workspace }}
  assert-no-linter-config-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install assert-no-linter-config-files
      - name: assert-no-linter-config-files
        run: >-
          assert-no-linter-config-files
          --linters markdownlint,yamllint
          --verbose
          ${{ github.workspace }}
  assert-no-oversized-source-files:
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "assert-no-oversized-source-files placeholder"
  assert-one-assert-per-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install assert-one-assert-per-test
      - name: assert-one-assert-per-test
        run: assert-one-assert-per-test --verbose src test lib
  build-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "build-coverage placeholder"
  build-debug:
    needs:
      - assert-coverage
      - assert-no-comments
      - assert-no-empty-test-files
      - assert-no-inline-directives
      - assert-no-linter-config-files
      - assert-no-oversized-source-files
      - assert-one-assert-per-test
      - rustfmt
      - yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build the program and the tests
        run: |
          cargo test --locked --no-run \
            --message-format=json-render-diagnostics \
            --test unit --test integration --test e2e > build.json
          for tier in unit integration e2e; do
            built="select(.profile.test and .target.name == \"$tier\")"
            cp "$(jq -r "$built.executable" build.json)" \
              "target/debug/test-$tier"
          done
          tar -cf debug.tar target/debug/cladenc target/debug/test-*
      - name: Hand on what was built
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug.tar
          retention-days: 1
  build-release:
    needs:
      - e2e-test-debug
      - integration-test-debug
      - unit-test-debug
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "build-release placeholder"
  e2e-test-coverage:
    needs: build-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "e2e-test-coverage placeholder"
  e2e-test-debug:
    needs: build-debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Take what was built
        uses: actions/download-artifact@v4
        with:
          name: debug
      - name: E2E tests
        run: |
          tar -xf debug.tar
          target/debug/test-e2e
  integration-test-coverage:
    needs: build-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "integration-test-coverage placeholder"
  integration-test-debug:
    needs: build-debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Take what was built
        uses: actions/download-artifact@v4
        with:
          name: debug
      - name: Integration tests
        run: |
          tar -xf debug.tar
          target/debug/test-integration
  package:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "package placeholder"
  release:
    needs: test-package
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "release placeholder"
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: rustfmt
        run: cargo fmt --all --check
  test-package:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "test-package placeholder"
  unit-test-coverage:
    needs: build-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "unit-test-coverage placeholder"
  unit-test-debug:
    needs: build-debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Take what was built
        uses: actions/download-artifact@v4
        with:
          name: debug
      - name: Unit tests
        run: |
          tar -xf debug.tar
          target/debug/test-unit
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install yamllint
      - name: yamllint
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING, $TRUTHY"
          yamllint --strict --format github \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/release.yml
name: release
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "lib/**"
      - "src/**"
      - "test/**"
