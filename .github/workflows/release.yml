---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
defaults:
  run:
    shell: bash
env:
  IMAGES: debian:stable-slim goreleaser/nfpm
jobs:
  assert-coverage:
    needs:
      - e2e-test-coverage
      - integration-test-coverage
      - unit-test-coverage
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Take the instrumented build and the profiles of each tier
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          pattern: coverage-*
      - name: Assert that the tests reach every line and function
        run: |
          for packed in coverage.tar profiles-*.tar; do
            tar -xPf "$packed"
          done
          source coverage.env
          cargo llvm-cov report --show-missing-lines \
            --ignore-filename-regex '(^|/)tests/' \
            --fail-under-functions 100 \
            --fail-uncovered-lines 0
      - name: Assert that the tests reach every region
        run: |
          source coverage.env
          cargo llvm-cov report --json \
            --ignore-filename-regex '(^|/)tests/' > coverage.json
          python3 - <<'PYTHON'
          import json
          import os
          import sys
          with open("coverage.json") as report:
              files = json.load(report)["data"][0]["files"]
          missed = not files
          if missed:
              print("::error::the report lists no file")
          for file in files:
              for segment in file["segments"]:
                  line, column, count, counted, entered, gap = segment
                  if counted and entered and not gap and not count:
                      name = os.path.relpath(file["filename"])
                      where = f"file={name},line={line},col={column}"
                      print(f"::error {where}::no test reaches this region")
                      missed = True
          sys.exit(missed)
          PYTHON
  assert-coverage-of-each-tier:
    name: assert-coverage-of-the-${{ matrix.tier }}-tier
    needs:
      - integration-test-coverage
      - unit-test-coverage
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Restore what pip fetched before
        uses: actions/cache@v6
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/release.yml') }}
          path: ~/.cache/pip
          restore-keys: pip-${{ github.job }}-
      - name: Install dependencies
        run: pip install tree-sitter==0.26.1 tree-sitter-rust==0.24.2
      - name: Take the instrumented build
        uses: actions/download-artifact@v8
        with:
          name: coverage-build
      - name: Take the profiles of the tier
        uses: actions/download-artifact@v8
        with:
          name: coverage-${{ matrix.tier }}
      - env:
          TIER: ${{ matrix.tier }}
        name: Assert that the tier alone reaches its functions
        run: |
          tar -xPf coverage.tar
          tar -xPf "profiles-$TIER.tar"
          source coverage.env
          cargo llvm-cov report --json \
            --ignore-filename-regex '(^|/)tests/' > coverage.json
          python - <<'TIER'
          import json
          import os
          import subprocess
          import sys
          import tree_sitter_rust
          from tree_sitter import Language, Parser
          TIER = os.environ["TIER"]
          FILE_SYSTEM = {"File", "OpenOptions", "fs"}
          ASKED = {
              "canonicalize", "exists", "is_dir", "is_file", "is_symlink",
              "metadata", "read_dir", "read_link", "set_len",
              "set_permissions", "symlink_metadata", "sync_all",
              "sync_data", "try_exists",
          }
          PROGRAM = {"kill", "output", "spawn", "status", "try_wait", "wait"}
          CALLED = {"killpg", "symlink"}
          def within(root, whole):
              nodes = [root]
              while nodes:
                  node = nodes.pop()
                  yield node
                  for child in reversed(node.named_children):
                      if whole or child.type != "function_item":
                          nodes.append(child)
          def calls(node):
              if node.type == "scoped_identifier":
                  path = node.child_by_field_name("path")
                  last = path.text.decode().split("::")[-1] if path else ""
                  return last in FILE_SYSTEM
              if node.type != "call_expression":
                  return False
              called = node.child_by_field_name("function")
              if called.type == "identifier":
                  return called.text.decode() in CALLED
              if called.type != "field_expression":
                  return False
              method = called.child_by_field_name("field").text.decode()
              given = node.child_by_field_name("arguments").named_child_count
              return method in ASKED or method in PROGRAM and not given
          def span(node):
              first = (node.start_point[0] + 1, node.start_point[1] + 1)
              last = (node.end_point[0] + 1, node.end_point[1] + 1)
              return first, last
          def regions(function, segments):
              first, last = span(function)
              nested = [
                  span(node)
                  for node in within(function, True)
                  if node.type == "function_item" and node.id != function.id
              ]
              for line, column, count, counted, entered, gap in segments:
                  place = (line, column)
                  apart = any(start <= place <= end for start, end in nested)
                  if first <= place <= last and not apart and counted:
                      yield line, column, entered and not gap and not count
          parser = Parser(Language(tree_sitter_rust.language()))
          with open("coverage.json") as report:
              files = json.load(report)["data"][0]["files"]
          reported = {
              os.path.relpath(file["filename"]): file["segments"]
              for file in files
          }
          listed = subprocess.run(
              ["git", "ls-files", "-z", "src/*.rs"],
              capture_output=True, check=True, text=True,
          ).stdout.split("\0")
          missed = not files
          if missed:
              print("::error::the report lists no file")
          for path in filter(None, listed):
              if "/tests/" in path or path == "src/main.rs":
                  continue
              with open(path, "rb") as source:
                  tree = parser.parse(source.read())
              if tree.root_node.has_error:
                  print(f"::error file={path}::{path} could not be parsed")
                  missed = True
              for node in within(tree.root_node, True):
                  if node.type != "function_item":
                      continue
                  inside = within(node, False)
                  outside = any(calls(inner) for inner in inside)
                  if outside != (TIER == "integration"):
                      continue
                  name = node.child_by_field_name("name").text.decode()
                  found = list(regions(node, reported.get(path, [])))
                  if not found:
                      where = f"file={path},line={node.start_point[0] + 1}"
                      said = f"the report has no region of {name}"
                      print(f"::error {where}::{said}")
                      missed = True
                  for line, column, unreached in found:
                      if unreached:
                          where = f"file={path},line={line},col={column}"
                          said = f"no {TIER} test reaches this region"
                          said = f"{said} of {name}"
                          print(f"::error {where}::{said}")
                          missed = True
          sys.exit(missed)
          TIER
    strategy:
      fail-fast: false
      matrix:
        tier:
          - integration
          - unit
  assert-coverage-of-test-inputs:
    needs: cache-images
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: Restore what earlier runs compiled
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Take the images from the cache
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          key: ${{ needs.cache-images.outputs.key }}
          path: images.tar
      - name: Load the images
        run: docker load --input images.tar
      - name: Assert that its own tests reach every line, region and function
        run: |
          cargo llvm-cov --locked --show-missing-lines \
            --package test_inputs --test '*' \
            --ignore-filename-regex '(^|/)tests/' \
            --fail-under-functions 100 \
            --fail-under-lines 100 \
            --fail-under-regions 100
  assert-no-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Restore what pip fetched before
        uses: actions/cache@v6
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/release.yml') }}
          path: ~/.cache/pip
          restore-keys: pip-${{ github.job }}-
      - name: assert-no-comments
        uses: 10U-Labs/assert-no-comments@latest
        with:
          annotate: "true"
          trees: ${{ github.workspace }}
          verbose: "true"
  assert-no-empty-test-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Assert that every test file holds a test
        run: |
          tests=('tests/*.rs' 'src/*/tests/*.rs' 'crates/*/tests/*.rs')
          tests+=(':!*/main.rs' ':!*/mod.rs')
          found="$(git grep -LF '#[test]' -- "${tests[@]}" || true)"
          if [ -n "$found" ]; then
            for file in $found; do
              said="$file is a test file that holds no test"
              echo "::error file=$file::$said"
            done
            exit 1
          fi
  assert-no-file-program-or-network-in-unit-tests:
    needs: build-debug
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Take what was built
        uses: actions/download-artifact@v8
        with:
          name: debug
      - name: Restore the packages and lists apt fetched before
        uses: actions/cache@v6
        with:
          key: >-
            runner-apt-${{ github.job }}-${{
            hashFiles('.github/workflows/release.yml') }}
          path: apt
          restore-keys: runner-apt-${{ github.job }}-
      - name: Install strace
        run: |
          mkdir -p apt/archives/partial apt/lists/partial
          kept=(-o "Dir::Cache::archives=$PWD/apt/archives")
          kept+=(-o "Dir::State::lists=$PWD/apt/lists")
          sudo apt-get "${kept[@]}" update
          sudo apt-get "${kept[@]}" install --yes \
            --no-install-recommends strace
          sudo chmod -R a+rX apt
      - name: Assert that no unit test uses a file, a program or the network
        run: |
          tar -xf debug.tar
          python3 - <<'PYTHON'
          import concurrent.futures
          import os
          import re
          import subprocess
          import sys
          import tempfile
          UNIT_TESTS = "target/debug/test-unit"
          SOCKET = "import socket; socket.socket()"
          SHOWN = f"cat /dev/null; python3 -c '{SOCKET}'; :"
          BEGUN = {"prctl", "rseq", "set_robust_list"}
          APART = BEGUN | {"getcwd"}
          TRACED = ",".join(["%file", "%network", "execve", "execveat", *BEGUN])
          CALL = re.compile(r"(\d+) +(\w+)\(")
          def calls(command):
              with tempfile.TemporaryDirectory() as directory:
                  trace = os.path.join(directory, "trace")
                  subprocess.run(
                      ["strace", "-f", "-o", trace, "-e", f"trace={TRACED}",
                       *command],
                      capture_output=True,
                      env={**os.environ, "RUST_BACKTRACE": "0"},
                  )
                  if not os.path.exists(trace):
                      return []
                  with open(trace, errors="replace") as lines:
                      found = [(CALL.match(line), line) for line in lines]
              return [
                  (call[1], call[2], line[call.end(1):].strip())
                  for call, line in found
                  if call
              ]
          def said(what, command):
              traced = calls(command)
              if not traced or traced[0][1] != "execve":
                  return [f"strace did not trace {what} from its start"]
              main = traced[0][0]
              apart = [call for call in traced if call[0] != main]
              if not any(name in BEGUN for _, name, _ in apart):
                  return [f"the trace of {what} shows nothing but its start"]
              return [
                  f"{what} used a file, a program or the network: {line}"
                  for _, name, line in apart
                  if name not in APART
              ]
          def said_of(test):
              return said(test, [UNIT_TESTS, "--exact", test])
          def place(test):
              module = "src/" + "/".join(test.split("::")[:-1])
              files = [f"{module}.rs", f"{module}/mod.rs"]
              kept = [file for file in files if os.path.exists(file)]
              return f" file={kept[0]}" if kept else ""
          missed = False
          shown = said("a shell", ["sh", "-c", SHOWN])
          for name in ("openat", "execve", "socket"):
              if not any(f": {name}(" in line for line in shown):
                  print(f"::error::the check misses the {name} it is shown")
                  missed = True
          listed = subprocess.run(
              [UNIT_TESTS, "--list", "--format", "terse"],
              capture_output=True, check=True, text=True,
          ).stdout.splitlines()
          tests = [
              line.removesuffix(": test")
              for line in listed
              if line.endswith(": test")
          ]
          if not tests:
              print("::error::the unit tests list no test")
              missed = True
          with concurrent.futures.ThreadPoolExecutor() as pool:
              found = list(pool.map(said_of, tests))
          for test, lines in zip(tests, found):
              for line in lines:
                  line = line.replace("%", "%25")
                  print(f"::error{place(test)}::{line}")
                  missed = True
          print(f"{len(tests)} unit tests were traced")
          sys.exit(missed)
          PYTHON
  assert-no-inline-directives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Restore what pip fetched before
        uses: actions/cache@v6
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/release.yml') }}
          path: ~/.cache/pip
          restore-keys: pip-${{ github.job }}-
      - name: assert-no-inline-directives
        uses: 10U-Labs/assert-no-inline-directives@latest
        with:
          files: ${{ github.workspace }}
          tools: clippy,coverage,markdownlint,rustc,rustdoc,rustfmt,yamllint
          verbose: "true"
  assert-no-linter-config-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Restore what pip fetched before
        uses: actions/cache@v6
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/release.yml') }}
          path: ~/.cache/pip
          restore-keys: pip-${{ github.job }}-
      - name: assert-no-linter-config-files
        uses: 10U-Labs/assert-no-linter-config-files@latest
        with:
          directories: ${{ github.workspace }}
          exclude: ${{ github.workspace }}/etc/clippy/clippy.toml
          linters: clippy,markdownlint,rustc,rustdoc,rustfmt,yamllint
          verbose: "true"
  assert-no-oversized-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Restore what pip fetched before
        uses: actions/cache@v6
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/release.yml') }}
          path: ~/.cache/pip
          restore-keys: pip-${{ github.job }}-
      - name: Install dependencies
        run: pip install tree-sitter==0.26.1 tree-sitter-rust==0.24.2
      - name: Assert that no function has more than 50 statements
        run: |
          python - <<'PYTHON'
          import subprocess
          import sys
          import tree_sitter_rust
          from tree_sitter import Language, Parser
          LIMIT = 50
          APART = {"attribute_item", "block_comment", "label", "line_comment"}
          def within(root, whole):
              nodes = [root]
              while nodes:
                  node = nodes.pop()
                  yield node
                  for child in reversed(node.named_children):
                      if whole or child.type != "function_item":
                          nodes.append(child)
          def statements(function):
              return sum(
                  child.type not in APART
                  for node in within(function, False)
                  if node.type == "block"
                  for child in node.named_children
              )
          parser = Parser(Language(tree_sitter_rust.language()))
          listed = subprocess.run(
              ["git", "ls-files", "-z", "*.rs"],
              capture_output=True, check=True, text=True,
          ).stdout.split("\0")
          over = False
          for path in filter(None, listed):
              with open(path, "rb") as source:
                  tree = parser.parse(source.read())
              if tree.root_node.has_error:
                  print(f"::error file={path}::{path} could not be parsed")
                  over = True
              for node in within(tree.root_node, True):
                  if node.type != "function_item":
                      continue
                  count = statements(node)
                  if count > LIMIT:
                      name = node.child_by_field_name("name").text.decode()
                      line = node.start_point[0] + 1
                      said = f"{name} has {count} statements, and the limit is"
                      where = f"file={path},line={line}"
                      print(f"::error {where}::{said} {LIMIT}")
                      over = True
          sys.exit(over)
          PYTHON
  assert-no-oversized-source-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Assert that no Rust file has more than 1000 lines
        run: |
          git ls-files -z '*.rs' | xargs -0 wc -l | awk -v limit=1000 '
            $2 != "total" && $1 > limit {
              said = $2 " has " $1 " lines, and the limit is " limit
              print "::error file=" $2 "::" said
              over = 1
            }
            END { exit over }'
  assert-one-assert-per-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Restore what pip fetched before
        uses: actions/cache@v6
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/release.yml') }}
          path: ~/.cache/pip
          restore-keys: pip-${{ github.job }}-
      - name: assert-one-assert-per-test
        uses: 10U-Labs/assert-one-assert-per-test@latest
        with:
          files: src tests crates
          verbose: "true"
  assert-one-directory-per-module:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Assert that each module of src is a directory
        run: |
          files=(':(glob)src/*.rs' ':!src/lib.rs' ':!src/main.rs')
          found="$(git ls-files -- "${files[@]}")"
          if [ -n "$found" ]; then
            for file in $found; do
              said="$file is a module in a file: move it to"
              echo "::error file=$file::$said ${file%.rs}/mod.rs"
            done
            exit 1
          fi
  build-coverage:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: Restore what earlier runs compiled
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Build the program and the tests with coverage instrumentation
        run: |
          cargo llvm-cov show-env --sh > coverage.env
          source coverage.env
          cargo test --locked --no-run \
            --message-format=json-render-diagnostics \
            --lib --test integration --test e2e > build.json
          built='select(.profile.test and .target.kind == ["lib"])'
          jq -r "$built.executable" build.json > target/test-unit
          for tier in integration e2e; do
            built="select(.profile.test and .target.name == \"$tier\")"
            jq -r "$built.executable" build.json > "target/test-$tier"
          done
          unit="$(cat target/test-unit)"
          tar -cPf coverage.tar coverage.env target/debug/cladenc \
            target/test-* $(cat target/test-*) "${unit%/out/*}/fingerprint"
      - name: Hand on what was built
        uses: actions/upload-artifact@v7
        with:
          name: coverage-build
          path: coverage.tar
          retention-days: 1
  build-debug:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Restore what earlier runs compiled
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build the program and the tests
        run: |
          cargo test --locked --no-run \
            --message-format=json-render-diagnostics \
            --lib --test integration --test e2e > build.json
          built='select(.profile.test and .target.kind == ["lib"])'
          cp "$(jq -r "$built.executable" build.json)" target/debug/test-unit
          for tier in integration e2e; do
            built="select(.profile.test and .target.name == \"$tier\")"
            cp "$(jq -r "$built.executable" build.json)" \
              "target/debug/test-$tier"
          done
          tar -cf debug.tar target/debug/cladenc target/debug/test-*
      - name: Hand on what was built
        uses: actions/upload-artifact@v7
        with:
          name: debug
          path: debug.tar
          retention-days: 1
  build-release:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Restore what earlier runs compiled
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build the program for release
        run: |
          cargo build --locked --release
          cp target/release/cladenc cladenc-linux-arm64
      - name: Hand on the program
        uses: actions/upload-artifact@v7
        with:
          name: program
          path: cladenc-linux-arm64
          retention-days: 1
  cache-images:
    outputs:
      key: ${{ steps.key.outputs.key }}
    runs-on: ubuntu-24.04-arm
    steps:
      - id: key
        name: Name the cache after the digest of every image
        run: |
          for image in $IMAGES; do
            docker buildx imagetools inspect --raw "$image" | sha256sum
          done > digests
          key="images-$(sha256sum < digests | cut -c1-64)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - id: cached
        name: Look for the images in the cache
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
          path: images.tar
      - if: steps.cached.outputs.cache-hit != 'true'
        name: Fetch the images
        run: |
          for image in $IMAGES; do
            docker pull "$image"
          done
          docker save --output images.tar $IMAGES
      - if: steps.cached.outputs.cache-hit != 'true'
        name: Keep the images in the cache
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.key.outputs.key }}
          path: images.tar
  clippy:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Restore what earlier runs compiled
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - env:
          CLIPPY_CONF_DIR: ${{ github.workspace }}/etc/clippy
        name: clippy
        run: >-
          cargo clippy --workspace --all-targets --locked --
          -D warnings
          -D clippy::cognitive_complexity
          -D clippy::self_named_module_files
          -D clippy::too_many_lines
  e2e-test-coverage:
    needs:
      - build-coverage
      - cache-images
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Take what was built
        uses: actions/download-artifact@v8
        with:
          name: coverage-build
      - name: Take the images from the cache
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          key: ${{ needs.cache-images.outputs.key }}
          path: images.tar
      - name: Load the images
        run: docker load --input images.tar
      - name: E2E tests, keeping their profiles
        run: |
          tar -xPf coverage.tar
          source coverage.env
          export LLVM_PROFILE_FILE="$PWD/target/e2e-%p-%m.profraw"
          "$(cat target/test-e2e)"
          tar -cf profiles-e2e.tar target/*.profraw
      - name: Hand on the profiles
        uses: actions/upload-artifact@v7
        with:
          name: coverage-e2e
          path: profiles-e2e.tar
          retention-days: 1
  e2e-test-debug:
    needs:
      - build-debug
      - cache-images
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Take what was built
        uses: actions/download-artifact@v8
        with:
          name: debug
      - name: Take the images from the cache
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          key: ${{ needs.cache-images.outputs.key }}
          path: images.tar
      - name: Load the images
        run: docker load --input images.tar
      - name: E2E tests
        run: |
          tar -xf debug.tar
          target/debug/test-e2e
  integration-test-coverage:
    needs:
      - build-coverage
      - cache-images
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Take what was built
        uses: actions/download-artifact@v8
        with:
          name: coverage-build
      - name: Take the images from the cache
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          key: ${{ needs.cache-images.outputs.key }}
          path: images.tar
      - name: Load the images
        run: docker load --input images.tar
      - name: Integration tests, keeping their profiles
        run: |
          tar -xPf coverage.tar
          source coverage.env
          export LLVM_PROFILE_FILE="$PWD/target/integration-%p-%m.profraw"
          "$(cat target/test-integration)"
          tar -cf profiles-integration.tar target/*.profraw
      - name: Hand on the profiles
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: profiles-integration.tar
          retention-days: 1
  integration-test-debug:
    needs:
      - build-debug
      - cache-images
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Take what was built
        uses: actions/download-artifact@v8
        with:
          name: debug
      - name: Take the images from the cache
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          key: ${{ needs.cache-images.outputs.key }}
          path: images.tar
      - name: Load the images
        run: docker load --input images.tar
      - name: Integration tests
        run: |
          tar -xf debug.tar
          target/debug/test-integration
  package:
    needs:
      - build-release
      - cache-images
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Take the program
        uses: actions/download-artifact@v8
        with:
          name: program
          path: programs
      - name: Take the images from the cache
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          key: ${{ needs.cache-images.outputs.key }}
          path: images.tar
      - name: Load the images
        run: docker load --input images.tar
      - id: version
        name: Number the release by the time
        run: echo "version=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
      - env:
          VERSION: ${{ steps.version.outputs.version }}
        name: Make a .deb
        run: |
          mkdir package stage
          cp programs/cladenc-linux-arm64 stage/cladenc
          docker run --rm --volume "$PWD:/work" --workdir /work \
            --env VERSION goreleaser/nfpm package \
            --config etc/nfpm/nfpm.yaml --packager deb \
            --target package/cladenc-linux-arm64.deb
      - name: Hand on the package
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: package
          retention-days: 1
  release:
    if: github.ref_name == 'main'
    needs:
      - assert-coverage
      - assert-coverage-of-each-tier
      - assert-coverage-of-test-inputs
      - assert-no-comments
      - assert-no-empty-test-files
      - assert-no-file-program-or-network-in-unit-tests
      - assert-no-inline-directives
      - assert-no-linter-config-files
      - assert-no-oversized-functions
      - assert-no-oversized-source-files
      - assert-one-assert-per-test
      - assert-one-directory-per-module
      - cache-images
      - clippy
      - e2e-test-debug
      - integration-test-debug
      - package
      - rustfmt
      - test-package
      - unit-test-debug
      - yamllint
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Take the program
        uses: actions/download-artifact@v8
        with:
          name: program
          path: release
      - name: Take the package
        uses: actions/download-artifact@v8
        with:
          name: package
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.package.outputs.version }}
        name: Publish the release and move the tag latest to it
        run: |
          test "$TAG" != v
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --generate-notes \
              --target "$GITHUB_SHA" release/*
          git tag --force latest
          git push --force origin latest
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt, on every crate
        run: cargo fmt --all --check
      - name: rustfmt, on every Rust file, built or not
        run: rustfmt --check --edition 2024 $(git ls-files '*.rs')
  test-package:
    needs:
      - cache-images
      - package
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Take the package
        uses: actions/download-artifact@v8
        with:
          name: package
          path: package
      - name: Take the images from the cache
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          key: ${{ needs.cache-images.outputs.key }}
          path: images.tar
      - name: Load the images
        run: docker load --input images.tar
      - name: Restore the packages and lists apt fetched before
        uses: actions/cache@v6
        with:
          key: apt-${{ needs.cache-images.outputs.key }}
          path: apt
          restore-keys: apt-
      - name: Install the package on a clean system and run what it needs
        run: >-
          docker run --rm --env DEBIAN_FRONTEND=noninteractive
          --volume "$PWD/package:/package:ro"
          --volume "$PWD/apt/archives:/var/cache/apt/archives"
          --volume "$PWD/apt/lists:/var/lib/apt/lists"
          debian:stable-slim
          sh -ec 'rm -f /etc/apt/apt.conf.d/docker-clean
          && apt-get update
          && apt-get install --yes --no-install-recommends
          /package/cladenc-linux-arm64.deb man-db
          && /opt/cladenc/bin/cladenc --version
          && test -z "$(command -v cladenc)"
          && PATH="/opt/cladenc/bin:$PATH" cladenc --version
          && test "$(dpkg -L cladenc | grep -v -x -F -e /. -e /opt
          -e /opt/cladenc -e /opt/cladenc/bin -e /opt/cladenc/share
          -e /opt/cladenc/share/man -e /opt/cladenc/share/man/man1
          | LC_ALL=C sort | xargs)" = "/opt/cladenc/bin/cladenc
          /opt/cladenc/share/man/man1/cladenc-report.1
          /opt/cladenc/share/man/man1/cladenc-resume.1
          /opt/cladenc/share/man/man1/cladenc-start.1
          /opt/cladenc/share/man/man1/cladenc-status.1
          /opt/cladenc/share/man/man1/cladenc.1"
          && for page in cladenc cladenc-report cladenc-resume cladenc-start
          cladenc-status; do
          test "$(man -M /opt/cladenc/share/man --where "$page")"
          = "/opt/cladenc/share/man/man1/$page.1"
          && man -M /opt/cladenc/share/man "$page" | grep -q "SEE ALSO"
          || exit 1; done
          && test "$(PATH="/opt/cladenc/bin:$PATH" man --where cladenc-start)"
          = /opt/cladenc/share/man/man1/cladenc-start.1
          && test ! -e /etc/opt/cladenc
          && test ! -e /var/opt/cladenc
          && docker --version
          && timeout --version
          && chmod -R a+rX /var/cache/apt/archives /var/lib/apt/lists'
  unit-test-coverage:
    needs: build-coverage
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Take what was built
        uses: actions/download-artifact@v8
        with:
          name: coverage-build
      - name: Unit tests that start no docker, keeping their profiles
        run: |
          tar -xPf coverage.tar
          source coverage.env
          export LLVM_PROFILE_FILE="$PWD/target/unit-%p-%m.profraw"
          export CLADENC_TEST_ARGUMENTS_OF_DOCKER="$RUNNER_TEMP/docker"
          PATH="$PWD/tests/e2e/samples/fake:$PATH" "$(cat target/test-unit)"
          if [ -e "$CLADENC_TEST_ARGUMENTS_OF_DOCKER" ]; then
            echo "::error::a unit test started docker, given what follows"
            cat "$CLADENC_TEST_ARGUMENTS_OF_DOCKER"
            exit 1
          fi
          tar -cf profiles-unit.tar target/*.profraw
      - name: Hand on the profiles
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: profiles-unit.tar
          retention-days: 1
  unit-test-debug:
    needs: build-debug
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Take what was built
        uses: actions/download-artifact@v8
        with:
          name: debug
      - name: Unit tests that start no docker
        run: |
          tar -xf debug.tar
          export CLADENC_TEST_ARGUMENTS_OF_DOCKER="$RUNNER_TEMP/docker"
          PATH="$PWD/tests/e2e/samples/fake:$PATH" target/debug/test-unit
          if [ -e "$CLADENC_TEST_ARGUMENTS_OF_DOCKER" ]; then
            echo "::error::a unit test started docker, given what follows"
            cat "$CLADENC_TEST_ARGUMENTS_OF_DOCKER"
            exit 1
          fi
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Restore what pip fetched before
        uses: actions/cache@v6
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/release.yml') }}
          path: ~/.cache/pip
          restore-keys: pip-${{ github.job }}-
      - name: Install dependencies
        run: pip install yamllint
      - name: yamllint
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING, $TRUTHY"
          yamllint --strict --format github \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/release.yml
name: release
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "docs/**"
      - "etc/**"
      - "example/**"
      - "src/**"
      - "tests/**"
