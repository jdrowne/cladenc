---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
defaults:
  run:
    shell: bash
jobs:
  assert-coverage:
    needs:
      - e2e-test-coverage
      - integration-test-coverage
      - unit-test-coverage
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Take the instrumented build and the profiles of each tier
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          pattern: coverage-*
      - name: Assert that the tests reach every line, region and function
        run: |
          for packed in coverage.tar profiles-*.tar; do
            tar -xPf "$packed"
          done
          source coverage.env
          cargo llvm-cov report --show-missing-lines \
            --fail-under-functions 100 \
            --fail-under-lines 100 \
            --fail-under-regions 100
  assert-no-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install assert-no-comments
      - name: assert-no-comments
        run: >-
          assert-no-comments
          --annotate
          --verbose
          ${{ github.workspace }}
  assert-no-empty-test-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Assert that every test file holds a test
        run: |
          tests=('test/*.rs' ':!*/main.rs')
          found="$(git grep -LF '#[test]' -- "${tests[@]}" || true)"
          if [ -n "$found" ]; then
            for file in $found; do
              said="$file is a test file that holds no test"
              echo "::error file=$file::$said"
            done
            exit 1
          fi
  assert-no-inline-directives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install assert-no-inline-directives
      - name: assert-no-inline-directives
        run: >-
          assert-no-inline-directives
          --tools clippy,coverage,markdownlint,rustc,rustdoc,rustfmt,yamllint
          --verbose
          ${{ github.workspace }}
  assert-no-linter-config-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install assert-no-linter-config-files
      - name: assert-no-linter-config-files
        run: >-
          assert-no-linter-config-files
          --linters clippy,markdownlint,rustc,rustdoc,rustfmt,yamllint
          --verbose
          ${{ github.workspace }}
  assert-no-oversized-source-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Assert that no Rust file has more than 1000 lines
        run: |
          git ls-files -z '*.rs' | xargs -0 wc -l | awk -v limit=1000 '
            $2 != "total" && $1 > limit {
              said = $2 " has " $1 " lines, and the limit is " limit
              print "::error file=" $2 "::" said
              over = 1
            }
            END { exit over }'
  assert-one-assert-per-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install assert-one-assert-per-test
      - name: assert-one-assert-per-test
        run: assert-one-assert-per-test --verbose src test lib
  build-coverage:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Build the program and the tests with coverage instrumentation
        run: |
          cargo llvm-cov show-env --sh > coverage.env
          source coverage.env
          cargo test --locked --no-run \
            --message-format=json-render-diagnostics \
            --test unit --test integration --test e2e > build.json
          for tier in unit integration e2e; do
            built="select(.profile.test and .target.name == \"$tier\")"
            jq -r "$built.executable" build.json > "target/test-$tier"
          done
          tar -cPf coverage.tar coverage.env target/debug/cladenc \
            target/test-* $(cat target/test-*)
      - name: Hand on what was built
        uses: actions/upload-artifact@v4
        with:
          name: coverage-build
          path: coverage.tar
          retention-days: 1
  build-debug:
    needs:
      - assert-coverage
      - assert-no-comments
      - assert-no-empty-test-files
      - assert-no-inline-directives
      - assert-no-linter-config-files
      - assert-no-oversized-source-files
      - assert-one-assert-per-test
      - clippy
      - rustfmt
      - yamllint
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build the program and the tests
        run: |
          cargo test --locked --no-run \
            --message-format=json-render-diagnostics \
            --test unit --test integration --test e2e > build.json
          for tier in unit integration e2e; do
            built="select(.profile.test and .target.name == \"$tier\")"
            cp "$(jq -r "$built.executable" build.json)" \
              "target/debug/test-$tier"
          done
          tar -cf debug.tar target/debug/cladenc target/debug/test-*
      - name: Hand on what was built
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug.tar
          retention-days: 1
  build-release:
    needs:
      - e2e-test-debug
      - integration-test-debug
      - unit-test-debug
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build the program for release
        run: |
          cargo build --locked --release
          cp target/release/cladenc cladenc-linux-arm64
      - name: Hand on the program
        uses: actions/upload-artifact@v4
        with:
          name: program
          path: cladenc-linux-arm64
          retention-days: 1
  clippy:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
  e2e-test-coverage:
    needs: build-coverage
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Take what was built
        uses: actions/download-artifact@v4
        with:
          name: coverage-build
      - name: Fetch the image the tests start containers from
        run: docker pull busybox:1.37.0
      - name: E2E tests, keeping their profiles
        run: |
          tar -xPf coverage.tar
          source coverage.env
          export LLVM_PROFILE_FILE="$PWD/target/e2e-%p-%m.profraw"
          "$(cat target/test-e2e)"
          tar -cf profiles-e2e.tar target/*.profraw
      - name: Hand on the profiles
        uses: actions/upload-artifact@v4
        with:
          name: coverage-e2e
          path: profiles-e2e.tar
          retention-days: 1
  e2e-test-debug:
    needs: build-debug
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Take what was built
        uses: actions/download-artifact@v4
        with:
          name: debug
      - name: Fetch the image the tests start containers from
        run: docker pull busybox:1.37.0
      - name: E2E tests
        run: |
          tar -xf debug.tar
          target/debug/test-e2e
  integration-test-coverage:
    needs: build-coverage
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Take what was built
        uses: actions/download-artifact@v4
        with:
          name: coverage-build
      - name: Fetch the image the tests start containers from
        run: docker pull busybox:1.37.0
      - name: Integration tests, keeping their profiles
        run: |
          tar -xPf coverage.tar
          source coverage.env
          export LLVM_PROFILE_FILE="$PWD/target/integration-%p-%m.profraw"
          "$(cat target/test-integration)"
          tar -cf profiles-integration.tar target/*.profraw
      - name: Hand on the profiles
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: profiles-integration.tar
          retention-days: 1
  integration-test-debug:
    needs: build-debug
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Take what was built
        uses: actions/download-artifact@v4
        with:
          name: debug
      - name: Fetch the image the tests start containers from
        run: docker pull busybox:1.37.0
      - name: Integration tests
        run: |
          tar -xf debug.tar
          target/debug/test-integration
  package:
    needs: build-release
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Take the program
        uses: actions/download-artifact@v4
        with:
          name: program
          path: programs
      - id: version
        name: Number the release by the time
        run: echo "version=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
      - env:
          VERSION: ${{ steps.version.outputs.version }}
        name: Make a .deb
        run: |
          mkdir package stage
          cp programs/cladenc-linux-arm64 stage/cladenc
          docker run --rm --volume "$PWD:/work" --workdir /work \
            --env VERSION goreleaser/nfpm package \
            --config etc/nfpm/nfpm.yaml --packager deb \
            --target package/cladenc-linux-arm64.deb
      - name: Hand on the package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: package
          retention-days: 1
  release:
    if: github.ref_name == 'main'
    needs:
      - package
      - test-package
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Take the program
        uses: actions/download-artifact@v4
        with:
          name: program
          path: release
      - name: Take the package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.package.outputs.version }}
        name: Publish the release and move the tag latest to it
        run: |
          test "$TAG" != v
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --generate-notes \
              --target "$GITHUB_SHA" release/*
          git tag --force latest
          git push --force origin latest
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt, on every crate
        run: cargo fmt --all --check
      - name: rustfmt, on every Rust file, built or not
        run: rustfmt --check --edition 2024 $(git ls-files '*.rs')
  test-package:
    needs: package
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Take the package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: package
      - name: Install the package on a clean system and run what it needs
        run: >-
          docker run --rm --env DEBIAN_FRONTEND=noninteractive
          --volume "$PWD/package:/package:ro" ubuntu:latest
          sh -ec "apt-get update
          && apt-get install --yes --no-install-recommends
          /package/cladenc-linux-arm64.deb
          && cladenc --version
          && docker --version
          && timeout --version"
  unit-test-coverage:
    needs: build-coverage
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Take what was built
        uses: actions/download-artifact@v4
        with:
          name: coverage-build
      - name: Unit tests, keeping their profiles
        run: |
          tar -xPf coverage.tar
          source coverage.env
          export LLVM_PROFILE_FILE="$PWD/target/unit-%p-%m.profraw"
          "$(cat target/test-unit)"
          tar -cf profiles-unit.tar target/*.profraw
      - name: Hand on the profiles
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: profiles-unit.tar
          retention-days: 1
  unit-test-debug:
    needs: build-debug
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Take what was built
        uses: actions/download-artifact@v4
        with:
          name: debug
      - name: Unit tests
        run: |
          tar -xf debug.tar
          target/debug/test-unit
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install yamllint
      - name: yamllint
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING, $TRUTHY"
          yamllint --strict --format github \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/release.yml
name: release
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "etc/**"
      - "lib/**"
      - "src/**"
      - "test/**"
