[package]
name = "cladenc"
version = "0.1.0"
edition = "2024"

[dependencies]
nix = { version = "0.32.0", features = ["signal"] }
rand = "0.10.3"
rand_chacha = "0.10.0"
rand_distr = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
statrs = { version = "0.19.1", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.27.0"
test_inputs = { path = "lib/test_inputs" }

[[test]]
name = "integration"
path = "test/integration/main.rs"

[[test]]
name = "unit"
path = "test/unit/main.rs"

[workspace]
