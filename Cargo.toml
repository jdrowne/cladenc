[package]
name = "cladenc"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
nix = { version = "0.32.0", features = ["signal", "user"] }
rand = "0.10.3"
rand_chacha = "0.10.0"
rand_distr = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
toml = { version = "1.2.2", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
tempfile = "3.27.0"
test_inputs = { path = "crates/test_inputs" }

[workspace]
