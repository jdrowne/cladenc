[package]
name = "cladenc"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cladenc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
nix = { version = "0.32.0", features = ["signal", "user"] }
rand = "0.10.3"
rand_chacha = "0.10.0"
rand_distr = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"

[dev-dependencies]
tempfile = "3.27.0"
test_inputs = { path = "lib/test_inputs" }

[[test]]
name = "e2e"
path = "test/e2e/main.rs"

[[test]]
name = "integration"
path = "test/integration/main.rs"

[[test]]
name = "unit"
path = "test/unit/main.rs"

[workspace]
